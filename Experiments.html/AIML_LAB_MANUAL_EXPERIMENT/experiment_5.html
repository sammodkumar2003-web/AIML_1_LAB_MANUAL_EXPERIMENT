<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiemnt 5</title>
</head>
<body>
    <center><h1>Student Registration Form</h1></center>
    <hr>
    <form action="./experiment_5.html">
        Full Name: <input type="text" placeholder="Enter your full name"><br> <br>
        Email:     <input type="text" placeholder="Enter valid email address"> <br> <br>
        Password:  <input type="password" placeholder="Enter password"> <br><br>
        Gender :<label for="101">
            <input type="radio" name="Gender" id="101" value="male">Male
         </label>
         <label for="102">
            <input type="radio" name="Gender" id="102" value="female"> Female 
        </label>
        <label for="103"> 
            <input type="radio" name="Gender" id="103" value="other">Other
        </label><br><br>
        Course:<select name="course" id="101">
            <option value="">--Select Course--</option>
            <option value="CSE">CSE</option>
            <option value="CSE(AI&ML)">CSE(AI&ML)</option>
            <option value="CSE(DS)">CSE(DS)</option>
            <option value="ECE">ECE</option>
            <option value="EEE">EEE</option>
            <option value="ME">Mechanical ENG.</option>
            <option value="CIVIL">CIVIL ENG.</option>
        </select><br><br>
        Contact No: <input type="text" placeholder="Enter phone number"> <br><br>
        Address: <br>
        <textarea name="Address" id="101" rows="4" cols="40" placeholder="Enter your address"></textarea> <br><br>
        <button type="submit"> Register</button>
        <button type="submit">Clear</button>
        <hr>
       <center>&copy;2026 Student Registration Portal</center> 

    </form>
    
    
</body>
</html>
